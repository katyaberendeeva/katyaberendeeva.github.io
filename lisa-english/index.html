<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Лиза — English</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #f7f6f3;
    color: #24232a;
    font-family: 'DM Sans', sans-serif;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    padding: 45px 24px 70px;
}

.back {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    color: #77747d;
    text-decoration: none;
    font-size: 14px;
    margin-bottom: 45px;
}

.back:hover {
    color: #7c5cff;
}

.header {
    margin-bottom: 55px;
}

.label {
    display: inline-block;
    background: #eee9ff;
    color: #6c50d9;
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .04em;
    text-transform: uppercase;
    margin-bottom: 18px;
}

h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(48px, 8vw, 76px);
    line-height: 1;
    font-weight: 500;
    margin: 0 0 18px;
}

.subtitle {
    font-size: 17px;
    color: #77747d;
    line-height: 1.6;
    max-width: 570px;
}

.section-title {
    font-family: 'Playfair Display', serif;
    font-size: 30px;
    margin-bottom: 22px;
}

.lesson-card {
    display: block;
    background: white;
    border-radius: 24px;
    padding: 28px;
    text-decoration: none;
    color: inherit;
    border: 1px solid #ebe9e5;
    transition: .2s ease;
    position: relative;
    overflow: hidden;
}

.lesson-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 14px 35px rgba(50, 40, 80, .08);
    border-color: #dcd4ff;
}

.number {
    font-size: 13px;
    color: #8b7bc5;
    font-weight: 700;
    margin-bottom: 22px;
}

.lesson-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    margin-bottom: 8px;
}

.lesson-topic {
    color: #77747d;
    font-size: 16px;
    line-height: 1.5;
    margin-bottom: 25px;
}

.meta {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
}

.meta span {
    background: #f4f2ee;
    border-radius: 14px;
    padding: 8px 12px;
    font-size: 12px;
    color: #67646c;
}

.open {
    margin-top: 28px;
    color: #7257df;
    font-weight: 600;
    font-size: 14px;
}

.progress {
    margin-top: 48px;
    padding: 22px 24px;
    background: #fff;
    border-radius: 20px;
    border: 1px solid #ebe9e5;
}

.progress-top {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 13px;
    font-size: 13px;
    color: #77747d;
}

.progress-bar {
    height: 7px;
    background: #eeeae5;
    border-radius: 10px;
    overflow: hidden;
}

.progress-fill {
    width: 10%;
    height: 100%;
    background: #8b75e8;
    border-radius: 10px;
}

.coming {
    margin-top: 18px;
    padding: 24px;
    border-radius: 22px;
    border: 1px dashed #d8d3ca;
    color: #99959d;
}

.coming-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    color: #77747d;
    margin-bottom: 5px;
}

footer {
    margin-top: 65px;
    text-align: center;
    color: #aaa6ad;
    font-size: 13px;
}

@media (max-width: 600px) {
    .container {
        padding: 30px 18px 50px;
    }

    .header {
        margin-bottom: 40px;
    }

    .lesson-card {
        padding: 23px;
    }

    .lesson-title {
        font-size: 28px;
    }
}
</style>
</head>

<body>

<div class="container">

    <a href="../" class="back">← Все ученики</a>

    <header class="header">
        <div class="label">English</div>

        <h1>Лиза</h1>

        <div class="subtitle">
            Наши уроки английского — грамматика, практика,
            живые ситуации и уверенное использование языка.
        </div>
    </header>

    <section>
        <div class="section-title">Мои уроки</div>

        <a href="./liza-lesson.html" class="lesson-card">

            <div class="number">01</div>

            <div class="lesson-title">
                My New Life
            </div>

            <div class="lesson-topic">
                Present Simple vs Past Simple
            </div>

            <div class="meta">
                <span>60 минут</span>
                <span>Grammar</span>
                <span>Speaking</span>
            </div>

            <div class="open">
                Открыть урок →
            </div>

        </a>

        <div class="coming">
            <div class="coming-title">Следующий урок</div>
            Скоро появится здесь ✦
        </div>

    </section>

    <div class="progress">

        <div class="progress-top">
            <span>Прогресс</span>
            <span>1 урок</span>
        </div>

        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>

    </div>

    <footer>
        Катя • English
    </footer>

</div>

</body>
</html>
